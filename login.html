<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | Книгарня</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-body">
<header class="main-header">
    <div class="header-left">
        <div class="logo-wrapper">
            <span class="logo-text">BookStore</span>
        </div>
    </div>

    <div class="header-right">
        <nav>
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Каталог</a></li>
                <li><a href="users.html" class="nav-link">Користувачі</a></li>
                <li>
                    <a href="cart.html" class="nav-link header-icon-link" title="Кошик">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </a>
                </li>
                <li>
                    <a href="login.html" class="nav-link header-icon-link" title="Профіль">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/>
                        </svg>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <div class="auth-card">
        <h1>Вхід у систему</h1>
        <div class="error-notification">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            Невірний email або пароль
        </div>
        <form action="index.html" class="auth-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="example@mail.com" class="input-error">
                <span class="validation-error">Користувача з такою поштою не знайдено</span>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-primary btn-full">Увійти</button>

            <p class="form-footer">
                Немає акаунту?
                <a href="register.html" class="auth-link">Зареєструватися</a>
            </p>
        </form>
    </div>
</main>
<footer class="main-footer">
    <p>&copy; 2026 Книгарня</p>
</footer>
</body>
</html>
