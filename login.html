<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід | Книгарня</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
<header>
    <div class="header-left">
        <div class="logo">BookStore</div>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">Каталог</a></li>
                <li><a href="users.html">Користувачі</a></li>
            </ul>
        </nav>
    </div>
    <div class="header-right">
    </div>
</header>

<main class="container">
    <div class="auth-card">
        <h1>Вхід у систему</h1>
        <form action="index.html" class="auth-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary">Увійти</button>
            <p class="form-footer">Немає акаунту? <a href="create-user.html">Зареєструватися</a></p>
        </form>
    </div>
</main>
</body>
</html>
