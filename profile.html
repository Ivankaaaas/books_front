<!DOCTYPE html>

<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик | BookStore</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-body">
<header class="main-header">
    <div class="header-left">
        <a href="index.html" class="logo-link nav-link">
            <span class="logo-text">BookStore</span>
        </a>
    </div>
    <div class="header-right">
        <nav>
            <ul class="nav-list">
                <li>
                    <a href="users.html" id="admin-nav-link" class="nav-link" style="display: none;">Користувачі</a>
                </li>
                <li>
                    <a href="cart.html" class="nav-link header-icon-link" title="Кошик">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </a>
                </li>
                <li>
                    <a href="login.html" id="profile-icon-link" class="nav-link header-icon-link" title="Профіль">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/>
                        </svg>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>
<main class="container">
    <div class="auth-card profile-card" style="max-width: 400px; margin: 40px auto; padding: 30px;">
        <h2 style="margin-bottom: 25px; color: #2c3e50;">Мій профіль</h2>

        <form id="profile-form">
            <div class="form-group" style="margin-bottom: 15px; position: relative;">
                <label>Ім'я</label>
                <div style="position: relative;">
                    <input type="text" id="profile-first-name" readonly style="background-color: #f9f9f9; cursor: default;">
                    <span class="edit-icon" onclick="toggleEdit('profile-first-name')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.6;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </span>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 15px; position: relative;">
                <label>Прізвище</label>
                <div style="position: relative;">
                    <input type="text" id="profile-last-name" readonly style="background-color: #f9f9f9; cursor: default;">
                    <span class="edit-icon" onclick="toggleEdit('profile-last-name')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.6;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </span>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label>Email (не змінюється)</label>
                <input type="email" id="profile-email" readonly style="background-color: #f9f9f9; color: #888; cursor: not-allowed;">
            </div>

            <button type="submit" id="save-btn" class="btn-primary btn-full" style="display: none; margin-bottom: 10px;">Зберегти зміни</button>
        </form>

        <button onclick="logout()" class="btn-delete btn-full">Вийти</button>
    </div>
</main>
<footer class="main-footer">
    <p>&copy; 2026 Книгарня</p>
</footer>
<script src="main.js"></script>
</body>
</html>
