<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування користувача | BookStore</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header>
    <div class="header-left">
        <div class="logo">BookStore</div>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">Каталог</a></li>
                <li><a href="users.html">Користувачі</a></li>
            </ul>
        </nav>
    </div>
    <div class="header-right">
        <a href="login.html" class="user-profile" title="Вийти">
            <span class="user-icon">👤</span>
            <span class="logout-text">Вийти</span>
        </a>
    </div>
</header>

<main class="container">
    <section class="edit-section">
        <h1>Редагування користувача</h1>

        <form class="user-card auth-form">
            <div class="form-group">
                <label>Ім'я користувача</label>
                <input type="text" value="Олександр Онищенко">
            </div>

            <div class="form-group">
                <label>Роль</label>
                <select>
                    <option value="admin" selected>Admin</option>
                    <option value="regular">Regular</option>
                </select>
            </div>

            <div class="form-buttons" style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="btn-primary">Зберегти</button>
                <a href="users.html" class="btn-primary" style="background: #8AB1C7; text-decoration: none; text-align: center;">Скасувати</a>
            </div>
        </form>

        <div class="delete-zone" style="margin-top: 40px; border: 1px solid #e74c3c; padding: 20px; border-radius: 8px;">
            <h3 style="color: #e74c3c;">Небезпечна зона</h3>
            <p>Видалення користувача неможливо скасувати.</p>
            <button class="btn-danger" style="background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">
                Видалити користувача
            </button>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Книгарня. Створено для Lab 1.</p>
</footer>
</body>
</html>
