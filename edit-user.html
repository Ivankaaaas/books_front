<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування користувача</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-body">
<header class="main-header">
    <div class="header-left">
        <a href="index.html" class="logo-link nav-link">
            <span class="logo-text">BookStore</span>
        </a>
    </div>
    <div class="header-right">
        <nav>
            <ul class="nav-list">
                <li>
                    <a href="users.html" id="admin-nav-link" class="nav-link" style="display: none;">Користувачі</a>
                </li>
                <li>
                    <a href="cart.html" class="nav-link header-icon-link" title="Кошик">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </a>
                </li>
                <li>
                    <a href="login.html" id="profile-icon-link" class="nav-link header-icon-link" title="Профіль">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/>
                        </svg>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <a href="users.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Назад до списку
    </a>

    <div class="auth-card">
        <h2>Редагувати роль</h2>
        <p>Користувач: <strong id="user-name-display">Завантаження...</strong></p>

        <form id="edit-user-form">
            <div class="form-group">
                <label for="user-role">Тип користувача:</label>
                <select id="user-role" name="role">
                    <option value="user">Клієнт</option>
                    <option value="admin">Адміністратор</option>
                </select>
            </div>

            <div class="actions-group">
                <button type="submit" class="btn-primary">Зберегти зміни</button>
                <button type="button" id="delete-user-btn" class="btn-delete">Видалити користувача</button>
            </div>
        </form>
    </div>
</main>
<footer class="main-footer">
    <p>&copy; 2026 Книгарня</p>
</footer>
<script src="main.js"></script>
</body>
</html>
