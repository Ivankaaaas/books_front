<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування користувача</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-body">
<header class="main-header">
    <div class="header-left">
        <div class="logo-wrapper">
            <span class="logo-text">BookStore</span>
        </div>
    </div>
    <div class="header-right">
        <nav>
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Каталог</a></li>
                <li><a href="users.html" class="nav-link">Користувачі</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <a href="users.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Назад до списку
    </a>

    <div class="auth-card">
        <h2>Редагувати роль</h2>
        <p>Користувач: <strong>Іван Іванов</strong></p>

        <form action="users.html">
            <div class="form-group">
                <label for="user-role">Тип користувача:</label>
                <select id="user-role" name="role">
                    <option value="client">Клієнт</option>
                    <option value="admin">Адміністратор</option>
                    <option value="manager">Менеджер</option>
                </select>
            </div>

            <div class="actions-group">
                <button type="submit" class="btn-primary">Зберегти зміни</button>

                <a href="users.html" class="btn-delete">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    Видалити користувача
                </a>
            </div>
        </form>
    </div>
</main>
<footer class="main-footer">
    <p>&copy; 2026 Книгарня</p>
</footer>
</body>
</html>
