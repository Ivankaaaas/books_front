<!DOCTYPE html>

<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик | BookStore</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="page-body">
<header class="main-header">
    <div class="header-left">
        <div class="logo-wrapper"><span class="logo-text">BookStore</span></div>
    </div>
    <div class="header-right">
        <nav>
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Каталог</a></li>
                <li><a href="users.html" class="nav-link">Користувачі</a></li>
                <li>
                    <a href="cart.html" class="nav-link header-icon-link" title="Кошик">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </a>
                </li>
                <li>
                    <a href="login.html" class="nav-link header-icon-link" title="Профіль">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/>
                        </svg>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>
<main class="container">
    <a href="index.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Продовжити покупки
    </a>

    <h1>Ваш кошик</h1>

    <div class="auth-card cart-wrapper">
        <table class="cart-table">
            <thead>
            <tr class="cart-thead-row">
                <th class="cart-th-left">Книга</th>
                <th class="cart-th-left">Ціна</th>
                <th class="cart-th-left">Кількість</th>
                <th class="cart-th-left">Сума</th>
                <th class="cart-th-left">Дія</th>
            </tr>
            </thead>
            <tbody>
            <tr class="cart-tbody-row">
                <td class="cart-td-book">
                    <a href="book-details.html">
                        <img src="https://uabooks.net/posters/210.jpg" class="cart-img" alt="Обкладинка">
                    </a>
                    <div>
                        <a href="book-details.html" class="cart-book-title">
                            <strong>Цифрова фортеця</strong>
                        </a>
                        <small class="cart-book-author">Ден Браун</small>
                    </div>
                </td>
                <td>450 грн</td>
                <td>
                    <div class="cart-qty-wrapper">
                        <button class="qty-btn">-</button>
                        <span class="qty-num">1</span>
                        <button class="qty-btn">+</button>
                    </div>
                </td>
                <td class="cart-price-total">450 грн</td>
                <td>
                    <button class="btn-delete cart-delete-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="cart-footer">
            <div class="cart-total-label">
                Разом до оплати: <strong class="cart-total-value">450 грн</strong>
            </div>
            <button class="btn-primary cart-checkout-btn">
                Оформити замовлення
            </button>
        </div>
    </div>
</main>
<footer class="main-footer">
    <p>&copy; 2026 Книгарня</p>
</footer>
</body>
</html>
